<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotaract Club - Our Team</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="site-shell flex flex-col min-h-screen">

  <header class="site-header">
    <nav>
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="bg-white/90 p-1.5 rounded-lg shadow-sm group-hover:bg-white transition">
          <img src="https://drive.google.com/uc?export=view&id=1KgwIjgAFaTCj1DE-qDs01FCwo2S7arL0" alt="Club Logo" class="h-10 w-auto object-contain">
        </div>
        <span class="text-xl font-bold tracking-wide">RACPC</span>
      </a>
      <div class="space-x-6 text-sm sm:text-base font-medium">
        <a href="index.html" class="hover:underline">Home</a>
        <a href="about.html" class="hover:underline">About</a>
        <a href="members.html" class="font-semibold underline">Members</a>
        <a href="join.html" class="hover:underline">Join Us</a>
      </div>
    </nav>
  </header>

  <main class="page-section page-shell flex-grow w-full">
    <div class="section-heading">
      <span class="section-badge">Our Team</span>
      <h1 class="section-title">Meet Our Team</h1>
      <p class="section-subtitle">
        The dedicated leaders and passionate members driving positive impact in the Rotaract Club of Presidency College.
      </p>
    </div>

    <div id="membersGrid" class="member-grid mb-16">
      <p class="text-slate-500 col-span-full text-center">Loading members...</p>
    </div>

    <div class="form-card" style="max-width: 42rem; margin-inline: auto;">
      <h2 class="text-2xl font-bold text-slate-800 mb-4 text-center">Add New Member</h2>
      
      <form id="memberForm" class="space-y-4">
        <div class="form-field">
          <label class="block text-sm font-medium text-slate-700">Full Name</label>
          <input type="text" id="memberName" required class="form-control">
        </div>

        <div class="form-field">
          <label class="block text-sm font-medium text-slate-700">Role / Position</label>
          <input type="text" id="memberRole" placeholder="e.g. President, Secretary" required class="form-control">
        </div>

        <div class="form-field">
          <label class="block text-sm font-medium text-slate-700">Photo URL</label>
          <input type="url" id="memberPhoto" placeholder="https://images.unsplash.com/photo-..." required class="form-control">
        </div>

        <div class="form-field">
          <label class="block text-sm font-medium text-slate-700">Email Address</label>
          <input type="email" id="memberEmail" class="form-control">
        </div>

        <div class="form-field">
          <label class="block text-sm font-medium text-slate-700">Year</label>
          <input type="text" id="memberYear" placeholder="e.g. 2024-25" class="form-control">
        </div>

        <div class="form-field">
          <label class="block text-sm font-medium text-slate-700">Short Bio</label>
          <textarea id="memberBio" rows="3" placeholder="Brief introduction..." class="form-control"></textarea>
        </div>

        <button type="submit" class="primary-button" style="width: 100%;">
          Add Member
        </button>
      </form>
      <p id="memberMsg" class="status-message text-center text-sm hidden"></p>
    </div>
  </main>

  <footer class="site-footer py-6 text-center text-sm border-t border-slate-700">
    <p>&copy; Rotaract Club of Presidency College. All rights reserved.</p>
  </footer>

  <script>
    const API_URL = '/api/members';

    async function loadMembers() {
      const grid = document.getElementById('membersGrid');
      try {
        const res = await fetch(API_URL);
        const members = await res.json();

        if (!members || members.length === 0) {
          grid.innerHTML = `<p class="text-slate-500 col-span-full text-center">No members added yet. Use the form below to add members!</p>`;
          return;
        }

        grid.innerHTML = members.map(m => `
          <div class="member-card text-center">
            <img src="${m.photoUrl}" alt="${m.name}" class="w-full h-48 object-cover bg-slate-100" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
            <div class="member-card__body">
              <h3 class="member-name">${m.name}</h3>
              <span class="member-role">${m.role}</span>
              ${m.bio ? `<p class="text-slate-600 text-xs mt-2 leading-relaxed">${m.bio}</p>` : ''}
              ${m.email ? `<a href="mailto:${m.email}" class="text-sky-600 text-xs mt-2 block hover:underline">${m.email}</a>` : ''}
            </div>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = `<p class="text-amber-600 col-span-full text-center">Unable to load members right now.</p>`;
      }
    }

    document.getElementById('memberForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('memberMsg');

      const payload = {
        name: document.getElementById('memberName').value,
        role: document.getElementById('memberRole').value,
        photoUrl: document.getElementById('memberPhoto').value,
        email: document.getElementById('memberEmail').value,
        bio: document.getElementById('memberBio').value,
        year: document.getElementById('memberYear').value,
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          msg.textContent = 'Member added successfully!';
          msg.className = 'mt-3 text-center text-sm text-emerald-600 font-medium';
          msg.classList.remove('hidden');
          document.getElementById('memberForm').reset();
          loadMembers();
        } else {
          throw new Error('Failed to save');
        }
      } catch (err) {
        msg.textContent = 'Error adding member. Please try again.';
        msg.className = 'mt-3 text-center text-sm text-rose-600 font-medium';
        msg.classList.remove('hidden');
      }
    });

    loadMembers();
  </script>
</body>
</html>
