<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotaract Club - Faculty</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="site-shell flex flex-col min-h-screen">

  <header class="site-header">
    <nav>
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="bg-black/40 p-1.5 rounded-lg shadow-sm group-hover:bg-white/10 transition">
          <img src="images/site-logo.png" alt="Club Logo" class="h-10 w-auto object-contain">
        </div>
        <span class="text-xl font-bold tracking-wide">RACPC</span>
      </a>
      <div class="space-x-6 text-sm sm:text-base font-medium">
        <a href="index.html" class="hover:underline">Home</a>
        <a href="about.html" class="hover:underline">About</a>
        <a href="members.html" class="hover:underline">Members</a>
        <a href="faculty.html" class="font-semibold underline">Faculty</a>
        <a href="join.html" class="hover:underline">Join Us</a>
        <a href="contact.html" class="hover:underline">Contact</a>
      </div>
    </nav>
  </header>

  <section class="logo-banner">
    <img src="images/site-logo.png" alt="Rotaract Club of Presidency College">
  </section>

  <main class="page-section page-shell flex-grow w-full">
    <div class="section-heading">
      <span class="section-badge">Faculty</span>
      <h1 class="section-title">Faculty & Head of Rotaract</h1>
      <p class="section-subtitle">
        The guiding members of the Rotaract Club of <span class="presidency-word">Presidency</span> College.
      </p>
    </div>

    <div id="facultyGrid" class="member-grid mb-16">
      <p class="text-slate-500 col-span-full text-center">Loading faculty...</p>
    </div>
  </main>

  <footer class="site-footer py-6 text-center text-sm border-t border-amber-500/30">
    <p>&copy; Rotaract Club of <span class="presidency-word">Presidency</span> College. All rights reserved.</p>
  </footer>

  <script>
    const API_URL = '/api/faculty';

    function createFallbackPhoto(name) {
      const initials = String(name || 'Faculty')
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0])
        .join('')
        .toUpperCase() || 'F';

      const colors = ['d4af37', 'b8860b', '8b6914', 'c69c2e', 'e0b84b', 'a8801f', '5c4310'];
      const hash = [...String(name || 'Faculty')].reduce((value, character) => value + character.charCodeAt(0), 0);
      const background = colors[hash % colors.length];

      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#${background}" />
              <stop offset="100%" stop-color="#3a2e00" />
            </linearGradient>
          </defs>
          <rect width="400" height="400" rx="48" fill="url(#g)" />
          <circle cx="200" cy="170" r="74" fill="rgba(255,255,255,0.16)" />
          <text x="50%" y="56%" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="112" font-weight="700">${initials}</text>
        </svg>
      `.replace(/\s{2,}/g, ' ').trim())}`;
    }

    async function loadFaculty() {
      const grid = document.getElementById('facultyGrid');
      try {
        const res = await fetch(API_URL);
        const faculty = await res.json();

        if (!faculty || faculty.length === 0) {
          grid.innerHTML = `<p class="text-slate-500 col-span-full text-center">No faculty added yet.</p>`;
          return;
        }

        grid.innerHTML = faculty.map(f => {
          const photoUrl = (f.photoUrl && typeof f.photoUrl === 'string' && f.photoUrl.trim())
            ? f.photoUrl
            : createFallbackPhoto(f.name);

          return `
            <div class="member-card text-center">
              <img src="${photoUrl}" alt="${f.name}" class="w-full h-48 object-cover bg-slate-800" loading="lazy" onerror="this.onerror=null; this.src='${createFallbackPhoto(f.name)}';">
              <div class="member-card__body">
                <h3 class="member-name">${f.name}</h3>
                <span class="member-role">${f.role}</span>
                ${f.department ? `<p class="text-amber-200 text-sm mt-2 font-semibold">${f.department}</p>` : ''}
                ${f.bio ? `<p class="text-slate-300 text-xs mt-2 leading-relaxed">${f.bio}</p>` : ''}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        grid.innerHTML = `<p class="text-amber-400 col-span-full text-center">Unable to load faculty right now.</p>`;
      }
    }

    loadFaculty();
  </script>
</body>
</html>
