<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotaract Club - Our Team</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <header class="bg-sky-600 text-white shadow-md">
    <nav class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="bg-white/90 p-1.5 rounded-lg shadow-sm group-hover:bg-white transition">
          <img src="rotary-logo.png" alt="Rotary District 3192 Logo" class="h-10 w-auto object-contain">
        </div>
        <span class="text-xl font-bold tracking-wide">RACPC</span>
      </a>
      <div class="space-x-6 text-sm sm:text-base font-medium">
        <a href="index.html" class="hover:underline">Home</a>
        <a href="about.html" class="hover:underline">About</a>
        <a href="projects.html" class="hover:underline">Projects</a>
        <a href="members.html" class="font-semibold underline">Members</a>
        <a href="join.html" class="hover:underline">Join Us</a>
        <a href="contact.html" class="hover:underline">Contact</a>
      </div>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-12 flex-grow w-full">
    <div class="text-center mb-12">
      <h1 class="text-4xl font-extrabold text-sky-700 mb-3">Meet Our Team</h1>
      <p class="text-slate-600 max-w-2xl mx-auto">
        The dedicated leaders and passionate members driving positive impact in the Rotaract Club of Presidency College.
      </p>
    </div>

    <div id="membersGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mb-16">
      <p class="text-slate-500 col-span-full text-center">Loading members...</p>
    </div>

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md border border-slate-200">
      <h2 class="text-2xl font-bold text-slate-800 mb-4 text-center">Add New Member</h2>
      
      <form id="memberForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">Full Name</label>
          <input type="text" id="memberName" required class="w-full mt-1 p-2.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-sky-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Role / Position</label>
          <input type="text" id="memberRole" placeholder="e.g. President, Secretary" required class="w-full mt-1 p-2.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-sky-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Photo URL</label>
          <input type="url" id="memberPhoto" placeholder="https://images.unsplash.com/photo-..." required class="w-full mt-1 p-2.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-sky-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Email Address</label>
          <input type="email" id="memberEmail" class="w-full mt-1 p-2.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-sky-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Short Bio</label>
          <textarea id="memberBio" rows="3" placeholder="Brief introduction..." class="w-full mt-1 p-2.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-sky-500 outline-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-sky-600 text-white font-semibold py-3 rounded-md hover:bg-sky-700 transition">
          Add Member
        </button>
      </form>
      <p id="memberMsg" class="mt-3 text-center text-sm hidden"></p>
    </div>
  </main>

  <footer class="bg-slate-800 text-slate-300 py-6 text-center text-sm border-t border-slate-700">
    <p>&copy; Rotaract Club of Presidency College. All rights reserved.</p>
  </footer>

  <script>
    const API_URL = '/api/members';

    async function loadMembers() {
      const grid = document.getElementById('membersGrid');
      try {
        const res = await fetch(API_URL);
        const members = await res.json();

        if (!members || members.length === 0) {
          grid.innerHTML = `<p class="text-slate-500 col-span-full text-center">No members added yet. Use the form below to add members!</p>`;
          return;
        }

        grid.innerHTML = members.map(m => `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden text-center hover:shadow-md transition">
            <img src="${m.photoUrl}" alt="${m.name}" class="w-full h-48 object-cover bg-slate-100" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
            <div class="p-4">
              <h3 class="font-bold text-lg text-slate-900">${m.name}</h3>
              <span class="inline-block my-1 px-3 py-1 bg-sky-100 text-sky-800 font-semibold text-xs rounded-full">${m.role}</span>
              ${m.bio ? `<p class="text-slate-600 text-xs mt-2 leading-relaxed">${m.bio}</p>` : ''}
              ${m.email ? `<a href="mailto:${m.email}" class="text-sky-600 text-xs mt-2 block hover:underline">${m.email}</a>` : ''}
            </div>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = `<p class="text-amber-600 col-span-full text-center">Unable to load members right now.</p>`;
      }
    }

    document.getElementById('memberForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('memberMsg');

      const payload = {
        name: document.getElementById('memberName').value,
        role: document.getElementById('memberRole').value,
        photoUrl: document.getElementById('memberPhoto').value,
        email: document.getElementById('memberEmail').value,
        bio: document.getElementById('memberBio').value,
        year: document.getElementById('memberYear').value,
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          msg.textContent = 'Member added successfully!';
          msg.className = 'mt-3 text-center text-sm text-emerald-600 font-medium';
          msg.classList.remove('hidden');
          document.getElementById('memberForm').reset();
          loadMembers();
        } else {
          throw new Error('Failed to save');
        }
      } catch (err) {
        msg.textContent = 'Error adding member. Please try again.';
        msg.className = 'mt-3 text-center text-sm text-rose-600 font-medium';
        msg.classList.remove('hidden');
      }
    });

    loadMembers();
  </script>
</body>
</html>
